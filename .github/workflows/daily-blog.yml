name: Daily TrustRoute Blog

on:
  schedule:
    - cron: "30 3 * * *" # 09:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate today's article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-blog.mjs

      - name: Commit and publish
        run: |
          git config user.name "TrustRoute Blog Bot"
          git config user.email "actions@users.noreply.github.com"
          git add blog blog.html sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m "chore: publish daily mobility insight"
          git push
